[package]
name = "kaleido-desktop"
version = "0.1.0"
description = "Kaleido thin desktop shell — loads the web workbench against local or remote kaleido-server"
authors = ["Kaleido contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "kaleido_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
