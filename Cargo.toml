[workspace]
resolver = "2"
members = [
  "crates/kaleido-core",
  "crates/kaleido-server",
  "crates/kaleido-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kaleido contributors"]

[workspace.dependencies]
unicode-normalization = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs", "compression-gzip", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
lazy_static = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dashmap = "6"
parking_lot = "0.12"
base64 = "0.22"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }


# Faster CI builds on self-hosted runner (4-core). LTO off + more codegen units.
[profile.release]
lto = false
codegen-units = 16
strip = true
incremental = true
