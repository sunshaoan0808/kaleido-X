# gitleaks 配置 —— 排除非密钥误报
#
# graphify-out/: 知识图谱缓存（已在 .gitignore），内含 SHA-256 摘要被 generic-api-key 误报
# smoke_u12a_u13_u14.py: 集成测试用的固定测试密码（非真实凭据）
# kaleido_appearance_v1: 前端 localStorage 键名（外观主题存储键，非 API key）
title = "kaleido gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "误报排除：graphify 缓存目录 + 集成测试固定密码 + 前端存储键名"
paths = [
  '''graphify-out/''',
  '''scripts/smoke_u12a_u13_u14\.py''',
]
stopwords = [
  '''smoke-main-20260809''',
  '''kaleido_appearance_v1''',
  '''kaleido_tavern_session_id''',
  '''kaleido_st_readpos_v1''',
]